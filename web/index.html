<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AvastFall TCG · Open Test ทดลองเล่น</title>
<meta name="description" content="เปิดให้ทดลองเล่น AvastFall TCG (Open Test) เล่นกับบอทหรือเล่นกับเพื่อนได้ทันที ไม่ต้องสมัคร">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/site.css"><!-- แถบเมนูเดียว Playtest · Card List · Deckbuilder -->
<link rel="stylesheet" href="css/theme.css"><!-- ธีมรวมให้เหมือนหน้า Card List (ต้องโหลดหลังสุด) -->
<style id="imgcss"></style><!-- CSS รูปการ์ด สร้างจาก URL ของ card-api (js/ui/data-sync.js) -->
</head>
<body>
<header class="site-bar" id="siteBar">
  <a class="site-brand" href="/" data-go="play" aria-label="AvastFall TCG"><i>A</i><span>AvastFall TCG</span><em>OPEN TEST</em></a>
  <div class="site-tools" id="siteTools" aria-label="ทางลัด">
    <button type="button" class="site-tool" data-packs id="hdrPacks">เปิดซอง</button>
    <button type="button" class="site-tool" data-hdr="guide" id="hdrGuide">วิธีเล่น</button>
    <button type="button" class="site-tool" data-hdr="notes" id="hdrNotes" aria-label="Update Note"><svg class="bell" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>Update Note</span><i class="dot" id="hdrNotesDot" hidden></i></button>
  </div>
  <div class="site-sw" id="siteSw" role="tablist" aria-label="เมนูเว็บ" data-tab="play">
    <span class="pill" aria-hidden="true"></span>
    <button role="tab" data-tab="play" aria-selected="true" aria-controls="panePlay" id="tabPlay">Playtest</button>
    <button role="tab" data-tab="cards" aria-selected="false" aria-controls="paneCards" id="tabCards" tabindex="-1">Card List</button>
    <button role="tab" data-tab="deck" aria-selected="false" aria-controls="paneCards" id="tabDeck" tabindex="-1">Deckbuilder</button>
  </div>
</header>
<div class="site-view" id="siteView" data-tab="play"><div class="site-track">
  <section class="site-pane" id="panePlay" role="tabpanel" aria-labelledby="tabPlay"><div class="wrap" id="app"></div></section>
  <section class="site-pane off" id="paneCards" role="tabpanel" aria-labelledby="tabCards"><iframe id="cardsFrame" title="Card List" data-src="/cards/?embed=1"></iframe></section>
</div></div>

<!-- เปิดซอง BT01: หน้าต่างซ้อนโหลด /packs.html ตอนกดครั้งแรก (เกมที่ค้างอยู่ไม่หาย) -->
<div class="pk-ov" id="pkOv" hidden role="dialog" aria-modal="true" aria-label="เปิดซอง">
  <div class="pk-ov-box"><button type="button" class="pk-ov-x" id="pkClose" aria-label="ปิด">✕</button><iframe id="pkFrame" title="เปิดซอง BT01" data-src="/packs.html"></iframe></div>
</div>

<!-- 1) กฎและเอนจิน (ไม่แตะ DOM) -->
<script src="js/engine/engine.js"></script>

<!-- 2) เอฟเฟกต์การ์ด: แก้/เพิ่มสคริปต์การ์ดที่นี่ (_kit = ตัวช่วยร่วม ต้องโหลดก่อนชุดการ์ด) -->
<script src="js/effects/_kit.js"></script>
<script src="js/effects/sd01.js"></script>
<script src="js/effects/sd02.js"></script>
<script src="js/effects/sd03.js"></script>
<script src="js/effects/sd04.js"></script>
<script src="js/effects/sd05.js"></script>
<script src="js/effects/sd06.js"></script>
<script src="js/effects/sd07.js"></script>
<script src="js/effects/bt01.js"></script>

<!-- 3) บอท -->
<script src="js/bot.js"></script>

<!-- 4) ข้อมูลการ์ด: snapshot สำรอง + ดึงข้อมูล/รูปจาก card-api -->
<script src="js/data/snapshot.js"></script>
<script src="js/data/cards-api.js"></script>
<script src="js/data/feedback-api.js"></script>

<!-- 5) หน้าจอ (UI) -->
<script src="js/ui/base.js"></script>
<script src="js/ui/notes.js"></script>
<script src="js/ui/data-sync.js"></script>
<script src="js/ui/decks.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/setup.js"></script>
<script src="js/ui/mydecks.js"></script>
<script src="js/ui/guide.js"></script>
<script src="js/ui/online.js"></script>
<script src="js/ui/game.js"></script>
<script src="js/ui/modals.js"></script>
<script src="js/ui/events.js"></script>
<script src="js/ui/main.js"></script>
<script src="js/site.js?v=3"></script><!-- แท็บเลื่อน ต้องโหลดหลังสุด -->
</body>
</html>
